<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Navigation Game — Balloon Garage</title>
<!-- ?v= is a cache buster: phones hold on to the old JavaScript for a long
     time, so bump it whenever a file under js/ or css/ changes -->
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<canvas id="stage"></canvas>

<header id="hud">
  <div class="stats">
    <div class="stat"><span class="k" id="s-caught">0</span><span class="l">caught</span></div>
    <div class="stat"><span class="k" id="s-escaped">0</span><span class="l">escaped</span></div>
    <div class="stat"><span class="k" id="s-unique">0/0</span><span class="l">models</span></div>
  </div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Balloon speed">
      <button type="button" data-speed="1" aria-pressed="true">Standard</button>
      <button type="button" data-speed="2" aria-pressed="false">Fast</button>
      <button type="button" data-speed="5" aria-pressed="false">Crazy</button>
    </div>
    <div class="seg" role="group" aria-label="Audio">
      <button id="btn-sfx" type="button" aria-pressed="true"><i class="led"></i>Effects</button>
      <button id="btn-music" type="button" aria-pressed="true"><i class="led"></i>Music</button>
      <select id="music-track" aria-label="Music track"></select>
    </div>
    <button id="btn-garage" type="button">Garage <kbd>G</kbd></button>
  </div>
</header>

<p id="hint">Prick a balloon with the pin — it sinks, and the car it was carrying drives home to your garage.</p>

<div id="toasts" aria-live="polite"></div>

<div id="garage" class="overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>Your garage</h2>
      <button id="btn-close" type="button" aria-label="Close garage">&times;</button>
    </div>
    <p class="sheet-sub" id="garage-sub"></p>
    <div id="garage-grid" class="grid"></div>
    <div class="sheet-foot">
      <button id="btn-reset" type="button" class="danger">Sell everything</button>
    </div>
  </div>
</div>

<script src="js/cars.js?v=4"></script>
<script src="js/balloons.js?v=4"></script>
<script src="js/garage.js?v=4"></script>
<script src="js/music.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
